spring.application.name=sigrap-backend
spring.profiles.default=local

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
logging.level.org.springframework=INFO
logging.level.com.sigrap=DEBUG

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.display-request-duration=true
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# JWT Configuration
# Secret key must be Base64 encoded and at least 256 bits (32 bytes) for HS256
# Default value is for development only - MUST be overridden in production via environment variable
jwt.secret=${JWT_SECRET:c2lncmFwLWRlZmF1bHQtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtb25seS1kb25vdHVzZWlucHJvZHVjdGlvbg==}
# Token expiration in milliseconds (default: 24 hours = 86400000ms)
jwt.expiration=${JWT_EXPIRATION:86400000}